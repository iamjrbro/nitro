<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McLaren Rosa - Race</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0014; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; }
canvas { display:block; }
#wrapper { position:relative; width:600px; height:440px; border-radius:16px; overflow:hidden; }
#ui { position:absolute; top:12px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 16px; pointer-events:none; }
.hud { background:rgba(0,0,0,0.5); color:#fff; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500; }
#msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:22px; font-weight:500; text-align:center; text-shadow:0 2px 8px #000; pointer-events:none; white-space:pre-line; display:none; }
#controls { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
#controls button { background:rgba(0,0,0,0.55); color:#fff; border:1.5px solid rgba(255,255,255,0.3); border-radius:12px; padding:10px 22px; font-size:15px; cursor:pointer; }
#controls button:active { background:rgba(255,80,180,0.6); }
#restartBtn { display:none; position:absolute; top:62%; left:50%; transform:translateX(-50%); background:rgba(255,50,150,0.85); color:#fff; border:none; border-radius:14px; padding:12px 28px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="hud" id="spd">0 km/h</div>
    <div class="hud" id="scr">Pontos: 0</div>
    <div class="hud" id="lap">Volta 1/3</div>
  </div>
  <div id="msg"></div>
  <div id="controls">
    <button id="btnL">◀ Esquerda</button>
    <button id="btnN">Nitro 🚀</button>
    <button id="btnR">Direita ▶</button>
  </div>
  <button id="restartBtn">🔄 Restart</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 600, H = 440;
canvas.width = W; canvas.height = H;

const ROAD_W = W * 0.62;
const ROAD_X = (W - ROAD_W) / 2;
const HORIZON = H * 0.35;

let keys = {};
let score = 0, lap = 1, maxLap = 3;
let nitro = 0, nitroMax = 100, nitroCool = false;
let gameOver = false, win = false;
let lapProgress = 0;

let car = { x: W/2, y: H - 100, w: 46, h: 80, speed: 0, vx: 0, angle: 0 };

let obstacles = [];
let stars = [];
let roadOffset = 0;
let frame = 0, obSpawn = 0;
let nitroFlash = 0;

for(let i=0;i<60;i++) stars.push({x:Math.random()*W, y:Math.random()*HORIZON*0.85, r:Math.random()*1.2+0.3, a:Math.random()});

function spawnObstacle() {
  const lanes = [ROAD_X+ROAD_W*0.15, ROAD_X+ROAD_W*0.38, ROAD_X+ROAD_W*0.62, ROAD_X+ROAD_W*0.82];
  const lx = lanes[Math.floor(Math.random()*lanes.length)];
  obstacles.push({x:lx, y:-60, w:38, h:70, color:['#3399ff','#ff6600','#22cc66','#cc2222'][Math.floor(Math.random()*4)], vx:(Math.random()-0.5)*1.2});
}

function drawBg() {
  let grad = ctx.createLinearGradient(0,0,0,HORIZON);
  grad.addColorStop(0,'#0a0014');
  grad.addColorStop(1,'#1a0040');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,HORIZON);
  stars.forEach(s=>{
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${0.5+0.5*Math.sin(frame*0.05+s.a)})`;
    ctx.fill();
  });
  let grad2 = ctx.createLinearGradient(0,HORIZON,0,H);
  grad2.addColorStop(0,'#111');
  grad2.addColorStop(1,'#1a1a1a');
  ctx.fillStyle=grad2; ctx.fillRect(0,HORIZON,W,H-HORIZON);
}

function drawRoad() {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ROAD_X, HORIZON);
  ctx.lineTo(ROAD_X+ROAD_W, HORIZON);
  ctx.lineTo(ROAD_X+ROAD_W, H);
  ctx.lineTo(ROAD_X, H);
  ctx.closePath();
  let rg = ctx.createLinearGradient(0,HORIZON,0,H);
  rg.addColorStop(0,'#222'); rg.addColorStop(1,'#333');
  ctx.fillStyle=rg; ctx.fill();

  ctx.strokeStyle='#444'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(ROAD_X,HORIZON); ctx.lineTo(ROAD_X,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ROAD_X+ROAD_W,HORIZON); ctx.lineTo(ROAD_X+ROAD_W,H); ctx.stroke();

  ctx.fillStyle='#ff3399'; ctx.fillRect(ROAD_X-18,HORIZON,18,H-HORIZON);
  ctx.fillStyle='#ff3399'; ctx.fillRect(ROAD_X+ROAD_W,HORIZON,18,H-HORIZON);

  for(let i=0;i<8;i++) {
    let yy = ((roadOffset + i*(H/8))%(H-HORIZON))+HORIZON;
    let t = (yy-HORIZON)/(H-HORIZON);
    let lw = 4+t*8;
    let dw = 40+t*80;
    let lx = ROAD_X + ROAD_W/2;
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.fillRect(lx-lw/2, yy, lw, dw*0.4);
  }
  ctx.restore();
}

function drawCar(x,y,w,h,color,acc,angle) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle*0.18);
  let bod = ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);
  bod.addColorStop(0,'#ff80cc');
  bod.addColorStop(0.45,color);
  bod.addColorStop(1,'#cc006e');
  ctx.fillStyle=bod;
  ctx.beginPath();
  ctx.roundRect(-w/2,-h/2,w,h,10);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(0,-h*0.1,w*0.32,h*0.22,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111e';
  ctx.beginPath(); ctx.roundRect(-w/2+4,-h/2+4,w*0.36,h*0.22,4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(w/2-4-w*0.36,-h/2+4,w*0.36,h*0.22,4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-w/2+4,h/2-4-h*0.22,w*0.36,h*0.22,4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(w/2-4-w*0.36,h/2-4-h*0.22,w*0.36,h*0.22,4); ctx.fill();
  ctx.fillStyle='rgba(255,220,255,0.9)';
  ctx.beginPath(); ctx.ellipse(0,h/2-8,w*0.3,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-w*0.28,-h/2+8,6,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*0.28,-h/2+8,6,4,0,0,Math.PI*2); ctx.fill();
  if(acc>0 && nitroFlash>0) {
    ctx.fillStyle=`rgba(80,180,255,${0.6+0.4*Math.sin(frame*0.8)})`;
    ctx.beginPath(); ctx.ellipse(0,h/2+14,10,22,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.fillStyle=o.color;
  ctx.beginPath(); ctx.roundRect(-o.w/2,-o.h/2,o.w,o.h,8); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.roundRect(-o.w/2+4,-o.h/2+6,o.w*0.38,o.h*0.22,4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(o.w/2-4-o.w*0.38,-o.h/2+6,o.w*0.38,o.h*0.22,4); ctx.fill();
  ctx.fillStyle='rgba(255,255,100,0.8)';
  ctx.beginPath(); ctx.ellipse(-o.w*0.28,o.h/2-8,5,3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(o.w*0.28,o.h/2-8,5,3,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawNitroBar() {
  let bx=ROAD_X, by=H-12, bw=ROAD_W, bh=7;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();
  let ng = ctx.createLinearGradient(bx,0,bx+bw,0);
  ng.addColorStop(0,'#00cfff'); ng.addColorStop(1,'#ff3399');
  ctx.fillStyle=ng;
  ctx.beginPath(); ctx.roundRect(bx,by,bw*(nitro/nitroMax),bh,4); ctx.fill();
}

function showMsg(txt, isWin) {
  let el=document.getElementById('msg');
  el.textContent=txt; el.style.display='block';
  el.style.color= isWin ? '#ffe' : '#fcc';
  document.getElementById('restartBtn').style.display='block';
}

function update() {
  if(gameOver||win) return;
  let acc=0;
  if(keys['ArrowLeft']||keys['left']) car.vx -= 4.5;
  if(keys['ArrowRight']||keys['right']) car.vx += 4.5;
  if(keys[' ']||keys['nitro']) {
    if(nitro>0&&!nitroCool) { nitroFlash=5; nitro=Math.max(0,nitro-1.5); acc=1; car.speed=Math.min(220,car.speed+3); }
  }
  car.speed = Math.min(160, car.speed+1.4);
  if(nitroFlash>0) nitroFlash--;
  car.vx *= 0.78;
  car.x += car.vx;
  car.angle = car.vx*0.08;
  car.x = Math.max(ROAD_X+car.w/2+4, Math.min(ROAD_X+ROAD_W-car.w/2-4, car.x));

  if(nitro<nitroMax&&nitroCool) { nitro+=0.3; if(nitro>=nitroMax) nitroCool=false; }
  if(!nitroCool&&nitro<nitroMax) nitro=Math.min(nitroMax,nitro+0.18);
  if(nitro<=0) { nitroCool=true; }

  let spd = nitroFlash>0 ? car.speed*1.5 : car.speed;
  roadOffset = (roadOffset + spd*0.025*6) % (H/8);

  lapProgress += spd * 0.00012;
  if(lapProgress>=1) { lapProgress=0; lap++; score+=500; if(lap>maxLap){ win=true; showMsg('🏆 Você Venceu!', true); return; } }

  frame++; obSpawn++;
  let spawnRate = Math.max(38, 90-lap*12-Math.floor(frame/400)*6);
  if(obSpawn>spawnRate) { spawnObstacle(); obSpawn=0; }

  for(let i=obstacles.length-1;i>=0;i--) {
    let o=obstacles[i];
    o.y += spd*0.047;
    o.x += o.vx;
    if(o.x<ROAD_X+o.w/2) o.vx=Math.abs(o.vx);
    if(o.x>ROAD_X+ROAD_W-o.w/2) o.vx=-Math.abs(o.vx);
    if(o.y>H+60) { obstacles.splice(i,1); score+=10; continue; }
    let dx=Math.abs(car.x-o.x), dy=Math.abs(car.y-o.y);
    if(dx<(car.w/2+o.w/2-8)&&dy<(car.h/2+o.h/2-10)) {
      gameOver=true; showMsg('💥 Bateu!\nClique em Restart', false); return;
    }
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawRoad();
  obstacles.forEach(drawObstacle);
  drawCar(car.x, car.y, car.w, car.h, '#ff3399', nitroFlash>0?1:0, car.angle);
  drawNitroBar();
  document.getElementById('spd').textContent = Math.round(car.speed*(nitroFlash>0?1.5:1))+' km/h';
  document.getElementById('scr').textContent = 'Pontos: '+score;
  document.getElementById('lap').textContent = win?'FIM!': `Volta ${Math.min(lap,maxLap)}/${maxLap}`;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.addEventListener('keydown', e=>{ keys[e.key]=true; if(e.key===' ') e.preventDefault(); });
document.addEventListener('keyup', e=>{ keys[e.key]=false; });

document.getElementById('btnL').addEventListener('pointerdown',()=>keys['left']=true);
document.getElementById('btnL').addEventListener('pointerup',()=>keys['left']=false);
document.getElementById('btnR').addEventListener('pointerdown',()=>keys['right']=true);
document.getElementById('btnR').addEventListener('pointerup',()=>keys['right']=false);
document.getElementById('btnN').addEventListener('pointerdown',()=>keys['nitro']=true);
document.getElementById('btnN').addEventListener('pointerup',()=>keys['nitro']=false);

document.getElementById('restartBtn').addEventListener('click',()=>{
  car={x:W/2,y:H-100,w:46,h:80,speed:0,vx:0,angle:0};
  obstacles=[]; score=0; lap=1; nitro=0; nitroCool=false; lapProgress=0;
  gameOver=false; win=false; frame=0; obSpawn=0;
  document.getElementById('msg').style.display='none';
  document.getElementById('restartBtn').style.display='none';
});

loop();
</script>
</body>
</html>
